name: poc-chatwidget-full

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poc_chatwidget}
      POSTGRES_USER: ${POSTGRES_USER:-poc_chatwidget_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poc_chatwidget_password}
    ports:
      - '127.0.0.1:${FULL_DB_PORT:-25432}:5432'
    volumes:
      - poc_chatwidget_full_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-poc_chatwidget_user}:${POSTGRES_PASSWORD:-poc_chatwidget_password}@db:5432/${POSTGRES_DB:-poc_chatwidget}
      WIDGET_ALLOWED_ORIGINS: http://localhost:${FULL_ALLOWED_DEMO_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-poc_chatwidget_user}:${POSTGRES_PASSWORD:-poc_chatwidget_password}@db:5432/${POSTGRES_DB:-poc_chatwidget}
      WIDGET_SESSION_JWT_SECRET: ${WIDGET_SESSION_JWT_SECRET:-full-stack-poc-secret-change-before-sharing}
      WIDGET_SESSION_JWT_TTL_SECONDS: ${WIDGET_SESSION_JWT_TTL_SECONDS:-900}
      CHAT_CHANNEL: mock
    ports:
      - '127.0.0.1:${FULL_API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:3000/api/v1/health'', r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  widget:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FULL_WIDGET_PORT:-8082}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 5s
      retries: 10

  demo-allowed:
    build:
      context: .
      dockerfile: apps/demo/Dockerfile
      target: runner
      args:
        DEMO_WIDGET_SCRIPT_URL: http://localhost:${FULL_WIDGET_PORT:-8082}/widget.js
        DEMO_API_URL: http://localhost:${FULL_API_PORT:-3000}/api/v1
        DEMO_ACCESS: allowed
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FULL_ALLOWED_DEMO_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
      widget:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 5s
      retries: 10

  demo-blocked:
    build:
      context: .
      dockerfile: apps/demo/Dockerfile
      target: runner
      args:
        DEMO_WIDGET_SCRIPT_URL: http://localhost:${FULL_WIDGET_PORT:-8082}/widget.js
        DEMO_API_URL: http://localhost:${FULL_API_PORT:-3000}/api/v1
        DEMO_ACCESS: blocked
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FULL_BLOCKED_DEMO_PORT:-8081}:8080'
    depends_on:
      api:
        condition: service_healthy
      widget:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  poc_chatwidget_full_postgres_data:
